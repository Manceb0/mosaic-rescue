   <g id="text_1">
    <text style="fill: #00695c; font: 700 10px 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; text-anchor: start" x="30.24" y="24.878437" transform="rotate(-0 30.24 24.878437)">MOSAIC RESCUE  /  04</text>
   </g>
   <g id="text_2">
    <text style="fill: #163344; font: 700 25px 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; text-anchor: start" x="30.24" y="63.636094" transform="rotate(-0 30.24 63.636094)">Three evidence layers. Three different meanings.</text>
   </g>
   <g id="text_3">
    <text style="fill: #536572; font: 12px 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; text-anchor: start" x="30.24" y="90.478125" transform="rotate(-0 30.24 90.478125)">PCS/MVA evidence context: no patient-specific mosaic fraction or cell-lineage reconstruction.</text>
   </g>
   <g id="text_4">
    <text style="fill: #536572; font: 9px 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; text-anchor: start" x="30.24" y="504.358594" transform="rotate(-0 30.24 504.358594)">READING GUIDE · Schematic, not a new measurement · Sources and limits: docs/STORYBOARD.md</text>
   </g>
   <g id="text_5">
    <text style="fill: #00695c; font: 700 10px 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; text-anchor: start" x="51.12" y="152.318438" transform="rotate(-0 51.12 152.318438)">PATIENT / AGGREGATED WGS</text>
   </g>
   <g id="text_6">
    <text style="fill: #163344; font: 700 18px 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; text-anchor: start" x="44.64" y="182.157188" transform="rotate(-0 44.64 182.157188)">What was measured</text>
   </g>
   <g id="text_7">
    <text style="fill: #163344; font: 14px 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif" transform="translate(44.64 212.237813)">Chromosome-level RD and BAF.</text>
    <text style="fill: #163344; font: 14px 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif" transform="translate(44.64 229.510422)">Short-read signals at the</text>
    <text style="fill: #163344; font: 14px 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif" transform="translate(44.64 246.783031)">locus.</text>
    <text style="fill: #163344; font: 14px 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif" transform="translate(44.64 264.055641)"/>
    <text style="fill: #163344; font: 14px 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif" transform="translate(44.64 281.32825)">These summarize blood DNA;</text>
    <text style="fill: #163344; font: 14px 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif" transform="translate(44.64 298.600859)">they do not count abnormal</text>
    <text style="fill: #163344; font: 14px 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif" transform="translate(44.64 315.873469)">cells.</text>
   </g>
   <g id="text_8">
    <text style="fill: #145b8a; font: 700 10px 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; text-anchor: start" x="326.88" y="152.318438" transform="rotate(-0 326.88 152.318438)">SIMULATION / MODEL</text>
   </g>
   <g id="text_9">
    <text style="fill: #163344; font: 700 18px 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; text-anchor: start" x="320.4" y="182.157188" transform="rotate(-0 320.4 182.157188)">What was tested</text>
   </g>
   <g id="text_10">
    <text style="fill: #163344; font: 14px 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif" transform="translate(320.4 212.237813)">Mixing homolog directions can</text>
    <text style="fill: #163344; font: 14px 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif" transform="translate(320.4 229.510422)">recenter signed BAF.</text>
    <text style="fill: #163344; font: 14px 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif" transform="translate(320.4 246.783031)"/>
    <text style="fill: #163344; font: 14px 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif" transform="translate(320.4 264.055641)">The absolute-statistic collapse</text>
    <text style="fill: #163344; font: 14px 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif" transform="translate(320.4 281.32825)">was depth-confounded. No</text>
    <text style="fill: #163344; font: 14px 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif" transform="translate(320.4 298.600859)">validated detector resulted.</text>
   </g>
   <g id="text_11">
    <text style="fill: #86520b; font: 700 10px 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; text-anchor: start" x="602.64" y="152.318438" transform="rotate(-0 602.64 152.318438)">LITERATURE / OTHER CASES</text>
   </g>
   <g id="text_12">
    <text style="fill: #163344; font: 700 18px 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; text-anchor: start" x="596.16" y="182.157188" transform="rotate(-0 596.16 182.157188)">What informs the test</text>
   </g>
   <g id="text_13">
    <text style="fill: #163344; font: 14px 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif" transform="translate(596.16 212.237813)">RNA and long reads resolved a</text>
    <text style="fill: #163344; font: 14px 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif" transform="translate(596.16 229.510422)">hidden insertion in another</text>
    <text style="fill: #163344; font: 14px 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif" transform="translate(596.16 246.783031)">BUB1B case.</text>
    <text style="fill: #163344; font: 14px 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif" transform="translate(596.16 264.055641)"/>
    <text style="fill: #163344; font: 14px 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif" transform="translate(596.16 281.32825)">This motivates a test; it does</text>
    <text style="fill: #163344; font: 14px 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif" transform="translate(596.16 298.600859)">not transfer that finding to</text>
    <text style="fill: #163344; font: 14px 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif" transform="translate(596.16 315.873469)">this patient.</text>
   </g>
   <g id="text_14">
    <text style="fill: #86520b; font: 700 11px 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; text-anchor: start" x="43.2" y="407.238281" transform="rotate(-0 43.2 407.238281)">KEEP THE LAYERS SEPARATE</text>
   </g>
   <g id="text_15">
    <text style="fill: #163344; font: 12px 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; text-anchor: start" x="43.2" y="423.838125" transform="rotate(-0 43.2 423.838125)">A flat aggregate summary cannot establish or exclude cytogenetic MVA; simulation is not patient evidence.</text>
   </g>
   <g id="text_16">
    <text style="fill: #163344; font: 12px 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; text-anchor: start" x="43.2" y="469.198125" transform="rotate(-0 43.2 469.198125)">Still needed: suitable controls, phase, cell-level validation where relevant, and functional measurements.</text>
   </g>
  </g>
  <g id="text_17">
   <text style="fill: #5b6670; font: 6.2px 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; text-anchor: end" x="862.272" y="6.007031" transform="rotate(-0 862.272 6.007031)">Figure class: synthesis    Evidence origin: derived, external</text>
  </g>
 </g>
