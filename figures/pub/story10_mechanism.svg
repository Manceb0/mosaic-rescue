   <g id="text_1">
    <text style="fill: #00695c; font: 700 10px 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; text-anchor: start" x="30.24" y="24.878438" transform="rotate(-0 30.24 24.878438)">MOSAIC RESCUE  /  10</text>
   </g>
   <g id="text_2">
    <text style="fill: #163344; font: 700 25px 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; text-anchor: start" x="30.24" y="63.636094" transform="rotate(-0 30.24 63.636094)">Correct the defect, or merely help cells tolerate it?</text>
   </g>
   <g id="text_3">
    <text style="fill: #536572; font: 12px 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; text-anchor: start" x="30.24" y="90.478125" transform="rotate(-0 30.24 90.478125)">Proposed mechanism for this case: L0–L1. Functional support comes from other alleles and systems.</text>
   </g>
   <g id="text_4">
    <text style="fill: #536572; font: 9px 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; text-anchor: start" x="30.24" y="576.358594" transform="rotate(-0 30.24 576.358594)">READING GUIDE · Schematic, not a new measurement · Sources and limits: docs/STORYBOARD.md</text>
   </g>
   <g id="text_5">
    <text style="fill: #145b8a; font: 700 10px 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; text-anchor: start" x="51.12" y="151.598437" transform="rotate(-0 51.12 151.598437)">CASE / HYPOTHESIS</text>
   </g>
   <g id="text_6">
    <text style="fill: #163344; font: 700 18px 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; text-anchor: start" x="44.64" y="181.437187" transform="rotate(-0 44.64 181.437187)">Candidate allele pair</text>
   </g>
   <g id="text_7">
    <text style="fill: #163344; font: 13px 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif" transform="translate(44.64 210.757969)">Truncation: transcript decay</text>
    <text style="fill: #163344; font: 13px 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif" transform="translate(44.64 226.79682)">predicted.</text>
    <text style="fill: #163344; font: 13px 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif" transform="translate(44.64 242.835672)">Missense: instability is one</text>
    <text style="fill: #163344; font: 13px 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif" transform="translate(44.64 258.874523)">possibility.</text>
    <text style="fill: #163344; font: 13px 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif" transform="translate(44.64 274.913375)"/>
    <text style="fill: #163344; font: 13px 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif" transform="translate(44.64 290.952227)">Phase and function unresolved.</text>
   </g>
   <g id="text_8">
    <text style="fill: #86520b; font: 700 10px 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; text-anchor: start" x="326.88" y="151.598437" transform="rotate(-0 326.88 151.598437)">TO MEASURE</text>
   </g>
   <g id="text_9">
    <text style="fill: #163344; font: 700 18px 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; text-anchor: start" x="320.4" y="181.437187" transform="rotate(-0 320.4 181.437187)">Residual BUBR1</text>
   </g>
   <g id="text_10">
    <text style="fill: #163344; font: 13px 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif" transform="translate(320.4 210.757969)">Abundance, turnover and</text>
    <text style="fill: #163344; font: 13px 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif" transform="translate(320.4 226.79682)">checkpoint function.</text>
    <text style="fill: #163344; font: 13px 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif" transform="translate(320.4 242.835672)"/>
    <text style="fill: #163344; font: 13px 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif" transform="translate(320.4 258.874523)">Normal abundance would weaken</text>
    <text style="fill: #163344; font: 13px 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif" transform="translate(320.4 274.913375)">instability, not rule out every</text>
    <text style="fill: #163344; font: 13px 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif" transform="translate(320.4 290.952227)">functional defect.</text>
   </g>
   <g id="text_11">
    <text style="fill: #00695c; font: 700 10px 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; text-anchor: start" x="602.64" y="151.598437" transform="rotate(-0 602.64 151.598437)">EXTERNAL / FUNCTIONAL</text>
   </g>
   <g id="text_12">
    <text style="fill: #163344; font: 700 18px 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; text-anchor: start" x="596.16" y="181.437187" transform="rotate(-0 596.16 181.437187)">Segregation errors</text>
   </g>
   <g id="text_13">
    <text style="fill: #163344; font: 13px 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif" transform="translate(596.16 210.757969)">Published MVA-cell experiments</text>
    <text style="fill: #163344; font: 13px 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif" transform="translate(596.16 226.79682)">link BUBR1 dysfunction to errors.</text>
    <text style="fill: #163344; font: 13px 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif" transform="translate(596.16 242.835672)"/>
    <text style="fill: #163344; font: 13px 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif" transform="translate(596.16 258.874523)">The specific causal chain remains</text>
    <text style="fill: #163344; font: 13px 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif" transform="translate(596.16 274.913375)">untested in this case.</text>
   </g>
   <g id="text_14">
    <text style="fill: #00695c; font: 700 10px 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; text-anchor: start" x="51.12" y="367.598438" transform="rotate(-0 51.12 367.598438)">T2-A / UPSTREAM QUESTION</text>
   </g>
   <g id="text_15">
    <text style="fill: #163344; font: 700 18px 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; text-anchor: start" x="44.64" y="397.437188" transform="rotate(-0 44.64 397.437188)">Restore useful function?</text>
   </g>
   <g id="text_16">
    <text style="fill: #163344; font: 14px 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif" transform="translate(44.64 427.517813)">Allele-directed or proteostasis hypotheses require</text>
    <text style="fill: #163344; font: 14px 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif" transform="translate(44.64 444.790422)">molecular engagement and functional rescue.</text>
   </g>
   <g id="text_17">
    <text style="fill: #a43a35; font: 700 10px 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; text-anchor: start" x="465.84" y="367.598438" transform="rotate(-0 465.84 367.598438)">T2-B / SAFETY CHALLENGE</text>
   </g>
   <g id="text_18">
    <text style="fill: #163344; font: 700 18px 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; text-anchor: start" x="459.36" y="397.437188" transform="rotate(-0 459.36 397.437188)">Increase stress tolerance?</text>
   </g>
   <g id="text_19">
    <text style="fill: #163344; font: 14px 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif" transform="translate(459.36 427.517813)">Cell survival may improve while chromosome</text>
    <text style="fill: #163344; font: 14px 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif" transform="translate(459.36 444.790422)">instability persists. That is not sufficient</text>
    <text style="fill: #163344; font: 14px 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif" transform="translate(459.36 462.063031)">rescue.</text>
   </g>
   <g id="text_20">
    <text style="fill: #163344; font: 700 13px 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; text-anchor: start" x="43.2" y="534.757969" transform="rotate(-0 43.2 534.757969)">Required together: molecular function · chromosome instability · clonogenic survival · viability</text>
   </g>
   <g id="text_21">
    <text style="fill: #536572; font: 10px 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; text-anchor: start" x="43.2" y="553.358438" transform="rotate(-0 43.2 553.358438)">External support: PMID 20516114, 25205676. Counterexample to drug translation: PMID 34481829.</text>
   </g>
  </g>
  <g id="text_22">
   <text style="fill: #5b6670; font: 6.2px 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; text-anchor: end" x="862.272" y="6.187031" transform="rotate(-0 862.272 6.187031)">Figure class: synthesis    Evidence origin: derived, external</text>
  </g>
