<rect x="370" y="584" width="200" height="46" rx="3" fill="#FFF" stroke="#14191E" stroke-width="2"/><text x="470" y="614" class="big" text-anchor="middle">BUB1B</text><line x1="470" y1="630" x2="470" y2="642" stroke="#14191E" stroke-width="1.5"/><line x1="280" y1="642" x2="660" y2="642" stroke="#14191E" stroke-width="1.5"/><line x1="280" y1="642" x2="280" y2="656" stroke="#2E7D6B" stroke-width="2"/><line x1="660" y1="642" x2="660" y2="656" stroke="#7A8590" stroke-width="2"/>
<text x="280" y="658" class="lbl" text-anchor="middle" fill="#2E7D6B">TRUNCANTE</text><text x="280" y="672" class="mono" text-anchor="middle">stop gained · PASS · het</text><line x1="280" y1="678" x2="280" y2="692" stroke="#DCE0E3" stroke-width="1.2"/><text x="280" y="712" class="lbl" text-anchor="middle" fill="#2E7D6B">PVS1</text><text x="280" y="726" class="mono" text-anchor="middle">PTC a 748 nt de la última unión</text><line x1="280" y1="732" x2="280" y2="746" stroke="#DCE0E3" stroke-width="1.2"/><text x="280" y="766" class="lbl" text-anchor="middle" fill="#2E7D6B">ClinVar</text><text x="280" y="780" class="mono" text-anchor="middle">pathogenic / likely pathogenic</text><line x1="280" y1="786" x2="280" y2="800" stroke="#DCE0E3" stroke-width="1.2"/>
<text x="660" y="658" class="lbl" text-anchor="middle" fill="#7A8590">MISSENSE</text><text x="660" y="672" class="mono" text-anchor="middle">rara · PASS · het</text><line x1="660" y1="678" x2="660" y2="692" stroke="#DCE0E3" stroke-width="1.2"/><text x="660" y="712" class="lbl" text-anchor="middle" fill="#7A8590">ausente de gnomAD</text><text x="660" y="726" class="mono" text-anchor="middle">SIFT y PolyPhen preocupantes</text><line x1="660" y1="732" x2="660" y2="746" stroke="#DCE0E3" stroke-width="1.2"/><text x="660" y="766" class="lbl" text-anchor="middle" fill="#7A8590">REVEL 0,472</text><text x="660" y="780" class="mono" text-anchor="middle">PP3 NO SE CUMPLE</text><line x1="660" y1="786" x2="660" y2="800" stroke="#DCE0E3" stroke-width="1.2"/><text x="660" y="820" class="lbl" text-anchor="middle" fill="#7A8590">panorama ClinVar</text><text x="660" y="834" class="mono" text-anchor="middle">PM1 · PS1 · PM5 NO SE CUMPLEN</text><line x1="660" y1="840" x2="660" y2="854" stroke="#DCE0E3" stroke-width="1.2"/>
<rect x="194" y="812" width="172" height="34" rx="3" fill="#2E7D6B" opacity=".16"/><text x="280" y="834" class="lbl" text-anchor="middle" fill="#2E7D6B">LIKELY PATHOGENIC</text><rect x="604" y="866" width="112" height="34" rx="3" fill="#7A8590" opacity=".16"/><text x="660" y="888" class="lbl" text-anchor="middle" fill="#7A8590">VUS</text>
