<text x="40" y="1012" class="sect">04 · El alelo que falta</text>
<text x="470" y="1066" class="lbl" text-anchor="middle">BUB1B ± locus regulador</text><text x="470" y="1080" class="mono" text-anchor="middle">gen ±100 kb · 270 kb</text><line x1="470" y1="1086" x2="470" y2="1098" stroke="#DCE0E3" stroke-width="1.2"/><text x="470" y="1118" class="lbl" text-anchor="middle">321 variantes</text><text x="470" y="1132" class="mono" text-anchor="middle">313 PASS · 8 en nivel de rescate</text><line x1="470" y1="1138" x2="470" y2="1150" stroke="#DCE0E3" stroke-width="1.2"/><text x="470" y="1170" class="lbl" text-anchor="middle">4 raras</text><text x="470" y="1184" class="mono" text-anchor="middle">&lt; 1e-3 · dos ya conocidas · una en PAK6</text><line x1="470" y1="1190" x2="470" y2="1202" stroke="#DCE0E3" stroke-width="1.2"/><text x="470" y="1222" class="lbl" text-anchor="middle">1 candidato nuevo</text><text x="470" y="1236" class="mono" text-anchor="middle">intrónico profundo · ausente de gnomAD</text><line x1="470" y1="1242" x2="470" y2="1254" stroke="#DCE0E3" stroke-width="1.2"/><text x="470" y="1274" class="lbl" text-anchor="middle">AlphaGenome</text><text x="470" y="1288" class="mono" text-anchor="middle">REF ≈ ALT · sin Δ coherente</text><text x="470" y="1312" class="big" text-anchor="middle" fill="#B4453A">✕</text>
<line x1="470" y1="1300" x2="470" y2="1340" stroke="#C07A2E" stroke-width="2"/><rect x="220" y="1340" width="500" height="72" rx="3" fill="#C07A2E" opacity=".12"/><rect x="220" y="1340" width="500" height="72" rx="3" fill="none" stroke="#C07A2E" stroke-width="2"/><text x="470" y="1364" class="lbl" text-anchor="middle" fill="#C07A2E" font-size="15">BÚSQUEDA DE ALELO ESTRUCTURAL · SV / CNV</text><text x="470" y="1384" class="lbl" text-anchor="middle" fill="#C07A2E">NEXT DATA BOTTLENECK</text><text x="470" y="1402" class="mono" text-anchor="middle">requiere BAM/CRAM de profundidad completa · solo L001 en disco (~13×)</text>

<text x="900" y="276" class="sect">Hipótesis eliminadas · y por qué</text><line x1="900" y1="286" x2="1400" y2="286" stroke="#DCE0E3"/><text x="900" y="312" class="big" fill="#B4453A">✕</text><text x="930" y="308" class="lbl">Candidatas HIGH renales</text><text x="930" y="324" class="mono" fill="#B4453A">frecuencia poblacional 0,08 – 0,81</text><line x1="900" y1="338" x2="1400" y2="338" stroke="#DCE0E3" stroke-width=".7"/><text x="900" y="370" class="big" fill="#B4453A">✕</text><text x="930" y="366" class="lbl">Missense como segundo alelo establecido</text><text x="930" y="382" class="mono" fill="#B4453A">evidencia ACMG insuficiente</text><line x1="900" y1="396" x2="1400" y2="396" stroke="#DCE0E3" stroke-width=".7"/><text x="900" y="428" class="big" fill="#B4453A">✕</text><text x="930" y="424" class="lbl">Candidato regulador SNV/indel</text><text x="930" y="440" class="mono" fill="#B4453A">AlphaGenome REF ≈ ALT</text><line x1="900" y1="454" x2="1400" y2="454" stroke="#DCE0E3" stroke-width=".7"/><text x="900" y="486" class="big" fill="#B4453A">✕</text><text x="930" y="482" class="lbl">Deleción grande que abarque BUB1B</text><text x="930" y="498" class="mono" fill="#B4453A">sin señal de profundidad ni pérdida de heterocigosidad</text><line x1="900" y1="512" x2="1400" y2="512" stroke="#DCE0E3" stroke-width=".7"/><text x="900" y="544" class="big" fill="#C07A2E">?</text><text x="930" y="540" class="lbl">SV pequeña o equilibrada</text><text x="930" y="556" class="mono" fill="#C07A2E">sin resolver sin alineamientos de profundidad completa</text><line x1="900" y1="570" x2="1400" y2="570" stroke="#DCE0E3" stroke-width=".7"/><text x="900" y="606" class="mono" opacity=".85">El último lleva interrogante, no aspa:</text><text x="900" y="622" class="mono" opacity=".85">no está descartado, está sin resolver.</text>
</svg>