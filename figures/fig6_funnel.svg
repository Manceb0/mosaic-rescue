<text x="40" y="52" class="sect">01 · Cantidad</text>
<text x="40" y="70" class="mono">ancho ∝ log(n) — a escala lineal el final sería invisible</text>
<path d="M308.0,120 L632.0,120 L631.7,206 L308.3,206 Z" fill="#8C99A4" opacity="0.90"/><text x="470" y="154" class="big" text-anchor="middle">5,012,204</text><text x="470" y="172" class="lbl" text-anchor="middle">variantes crudas</text><text x="648.0" y="160" class="mono">VCF completo · GRCh38 · Sentieon</text><path d="M308.3,206 L631.7,206 L511.7,292 L428.3,292 Z" fill="#8C99A4" opacity="0.75"/><text x="470" y="240" class="big" text-anchor="middle">4,943,948</text><text x="470" y="258" class="lbl" text-anchor="middle">anotadas a gen</text><text x="647.7" y="246" class="mono">VEP 116 offline · 68 256 en contigs decoy sin genes</text><path d="M428.3,292 L511.7,292 L480.9,378 L459.1,378 Z" fill="#8C99A4" opacity="0.60"/><text x="470" y="326" class="big" text-anchor="middle">13,581</text><text x="470" y="344" class="lbl" text-anchor="middle">HIGH + MODERATE</text><text x="527.7" y="332" class="mono">928 HIGH · 12 653 MODERATE, contadas por variante</text>

