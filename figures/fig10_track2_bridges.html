<text x="70" y="52" class="ttl">Track 2 — dos rutas con consecuencias oncologicas opuestas</text>
<text x="70" y="78" class="sub">EXTERNAL: evidencia publicada, tabla verificada del brief. DERIVED: la asignacion de cada evidencia a su puente.</text>
<text x="70" y="93" class="sub">Se nominan BRAZOS farmacologicos para discriminacion preclinica, no un ganador terapeutico. La figura ensena DONDE esta rota la cadena.</text>

<text x="70" y="146" class="big">A - los ocho puentes, y cuales estan vacios</text>
<text x="70" y="166" class="mono">la evidencia de un puente NO vale para otro. Agrupar las dos rutas bajo "proteostasis" hacia que lo pareciera.</text>

="273" class="lbl-s">-> menos CIN</text><text x="934" y="324" class="mono" fill="var(--alive)">evidencia publicada</text><text x="70" y="411" class="big">T2-B · tolerancia AGUAS ABAJO</text><text x="70" y="431" class="mono">las que ya existen viven mejor</text><rect x="70" y="455" width="250" height="96" rx="10" fill="var(--panel)" stroke="var(--alive)" stroke-width="3"/><circle cx="90" cy="475" r="12" fill="var(--alive)"/><text x="90" y="479" class="num" text-anchor="middle">5</text><text x="110" y="473" class="lbl-s">aneuploidia</text><text x="110" y="488" class="lbl-s">-> estres proteotoxico</text><text x="82" y="539" class="mono" fill="var(--alive)">evidencia publicada</text><path d="M324,503.0 L348,503.0" stroke="var(--ink-soft)" stroke-width="2" marker-end="url(#ar)"/><rect x="354" y="455" width="250" height="96" rx="10" fill="var(--panel)" stroke="var(--alive)" stroke-width="3"/><circle cx="374" cy="475" r="12" fill="var(--alive)"/><text x="374" y="479" class="num" text-anchor="middle">6</text><text x="394" y="473" class="lbl-s">subir HSP (genetico)</text><text x="394" y="488" class="lbl-s">-> rescate del estres</text><text x="366" y="539" class="mono" fill="var(--alive)">evidencia publicada</text><path d="M608,503.0 L632,503.0" stroke="var(--ink-soft)" stroke-width="2" marker-end="url(#ar)"/><rect x="638" y="455" width="250" height="96" rx="10" fill="var(--panel)" stroke="var(--dead)" stroke-width="3"/><circle cx="658" cy="475" r="12" fill="var(--dead)"/><text x="658" y="479" class="num" text-anchor="middle">7</text><text x="678" y="473" class="lbl-s">coinduccion FARMACOLOGICA</text><text x="678" y="488" class="lbl-s">-> el mismo rescate</text><text x="650" y="539" class="mono" fill="var(--dead)">HUECO</text><path d="M892,503.0 L916,503.0" stroke="var(--ink-soft)" stroke-width="2" marker-end="url(#ar)"/><rect x="922" y="455" width="250" height="96" rx="10" fill="var(--panel)" stroke="var(--void)" stroke-width="3"/><circle cx="942" cy="475" r="12" fill="var(--void)"/><text x="942" y="479" class="num" text-anchor="middle">8</text><text x="962" y="473" class="lbl-s">la intervencion</text><text x="962" y="488" class="lbl-s">-> efecto sobre CIN</text><text x="934" y="539" class="mono" fill="var(--void)">SIN EVIDENCIA QUE CUALIFIQUE</text>

<text x="70" y="624" class="mono">el buen candidato no es el que mas rescata:</text>
<text x="70" y="637" class="mono">es el que mejora el mecanismo SIN aumentar</text>

<rect x="380" y="650" width="310.0" height="160" fill="var(--alive)" opacity="0.13"/><rect x="690.0" y="810" width="310.0" height="160" fill="var(--dead)" opacity="0.13"/><line x1="380" y1="810" x2="1000" y2="810" stroke="var(--ink)" stroke-width="1.5"/><line x1="690.0" y1="650" x2="690.0" y2="970" stroke="var(--ink)" stroke-width="1.5"/><text x="690.0" y="636" class="lbl" text-anchor="middle">BENEFICIO</text><text x="690.0" y="996" class="lbl" text-anchor="middle" fill="var(--dead)">RIESGO ONCOLOGICO</text><text x="1014" y="814" class="mono">mayor supervivencia</text><text x="1014" y="827" class="mono">de celulas con CIN</text><text x="406" y="680" class="lbl" fill="var(--alive)">CORREDOR DE</text><text x="406" y="698" class="lbl" fill="var(--alive)">RESCATE SEGURO</text><circle cx="530" cy="680" r="9" fill="var(--alive)"/><text x="546" y="684" class="lbl-s">T2-A · mas BUBR1, menos CIN nueva</text><circle cx="810" cy="930" r="9" fill="var(--dead)"/><text x="824" y="934" class="lbl-s">T2-B · la celula tolera mejor</text><text x="824" y="949" class="mono">ser aneuploide</text><text x="406" y="930" class="mono" fill="var(--dead)">ZONA PROHIBIDA</text><text x="406" y="944" class="mono">rescata, pero hace viable</text><text x="406" y="957" class="mono">el clon inestable</text>
<text x="70" y="1054" class="lbl" fill="var(--void)">El puente 8 no esta debil: esta VACIO.</text>
<text x="70" y="1072" class="mono">Nuestra busqueda acotada no encontro evidencia que cualifique sobre que le hace ninguna de estas intervenciones a la CIN ni a la supervivencia clonogenica de celulas aneuploides frente a euploides isogenicas.</text>
<text x="70" y="1086" class="mono">Es el puente que decide si la hipotesis entra en el corredor o solo hace que una celula aneuploide se sienta mejor.</text>
