# Plantilla de rutas — MOSAIC RESCUE
#
# Copiar a config/paths.yaml y rellenar con las rutas reales.
# config/paths.yaml esta en .gitignore y NUNCA se commitea.
#
# El codigo no contiene rutas absolutas hardcodeadas. Todo pasa por aqui.
# Ver CONTRIBUTING_RESEARCH.md, Regla Dura 2.

# --- Datos del paciente (fuera del repositorio, siempre) ---
patient:
  # VCF de WGS + indice
  vcf:            /ruta/ficticia/WGS_XXXXXXXX_YYYYYYYY.vcf.gz
  vcf_index:      /ruta/ficticia/WGS_XXXXXXXX_YYYYYYYY.vcf.gz.tbi

  # FASTQ por carril. NovaSeq S4, 4 carriles, ~86 GB en total.
  # No alinear hasta la Fase 6: hay tres atajos documentados en el plan.
  fastq_dir:      /ruta/ficticia/fastq/
  lanes:          [L001, L002, L003, L004]

  # Documento de fenotipo. Bloqueado por .gitignore incluso dentro de docs/.
  phenotype_docx: /ruta/ficticia/Challenge_Clinical_Phenotype_1.docx

  # Sexo del probando: condiciona el modelo hemicigoto en X (MAGED2, Fase 1.2)
  sex:            desconocido        # XY | XX | desconocido

# --- Referencia ---
reference:
  # Confirmar el build en la cabecera del VCF antes de asumirlo (Fase 0.2)
  build:          GRCh38
  fasta:          /ruta/ficticia/GRCh38.fa
  fasta_index:    /ruta/ficticia/GRCh38.fa.fai

# --- Controles procesados con pipeline identico ---
# A 45-60x el factor limitante deja de ser el ruido binomial y pasa a ser
# el sesgo sistematico (GC, mapabilidad, sesgo de alelo de referencia).
# Eso convierte estos controles de deseables en OBLIGATORIOS. Ver brief §1.
controls:
  wgs_dir:        /ruta/ficticia/controles/
  n_minimo:       10
  pediatricos:    false             # ¿mismo rango de edad? Ver brief §7.4

# --- Salidas ---
output:
  work_dir:       ./work            # gitignored
  results_dir:    ./results         # gitignored

# --- EXP-027: benchmark público (1000G high-coverage) ---
# Rutas reales en config/paths.yaml; sha256 en config/exp027_benchmark.yaml al materializar.
# Nada de esto se descarga sin GO explícito con tamaño declarado.
exp027:
  hc_1000g_genotypes_dir:      /ruta/ficticia/1000g_hc/genotypes/
  hc_1000g_cram_dir:           /ruta/ficticia/1000g_hc/cram_slices/
  hc_1000g_reference_fasta:    /ruta/ficticia/1000g_hc/GRCh38_reference.fa
  hc_1000g_pedigree:           /ruta/ficticia/1000g_hc/pedigree.ped
  hc_1000g_sv_callset:         /ruta/ficticia/1000g_hc/sv_callset.vcf.gz
  phase3_unrelated_ids:        /ruta/ficticia/1000g_phase3_unrelated_2504.txt
  genetic_map_grch38:          /ruta/ficticia/maps/genetic_map_grch38.gmap.gz
  gaps_centromeres_grch38:     /ruta/ficticia/tracks/gaps_centromeres_grch38.bed
  segdups_grch38:              /ruta/ficticia/tracks/segdups_grch38.bed
  encode_blacklist_v2_grch38:  /ruta/ficticia/tracks/encode_blacklist_v2_grch38.bed
  gencode_v33_gff3:            /ruta/ficticia/gencode.v33.annotation.gff3.gz
  work_dir:                    ./work/exp027      # gitignored

# --- APIs externas ---
# Las claves NO van aqui. Van en .env (gitignored), y se leen por variable
# de entorno. Este bloque solo documenta cuales hacen falta.
apis:
  alphagenome:
    env_var:      ALPHAGENOME_API_KEY   # ver .env
    fase:         6.2                   # unica fase donde se usa
    # La API esta orientada a lotes pequenos/medianos (miles de predicciones),
    # no a barridos de millones de variantes. Enviar solo la shortlist.
    max_variantes: 500

# --- Recursos ---
compute:
  threads:        8
  memoria_gb:     32
  seed:           42                # semilla fija para todo proceso estocastico
