# EXP-027 · Phase 1 + A1 · parámetros congelados (transcripción, no diseño)
#
# Fuente de verdad: docs/DECISIONS.md § EXP-027 (contrato + Amendments 1-8 + nota pre-dato).
# Cada valor cita su regla. Si algo aquí contradice a DECISIONS, gana DECISIONS y esto es un error.
# Las rutas viven en config/paths.yaml (claves exp027.*); aquí no hay rutas absolutas.
# Los elementos dependientes de datos quedan como TO_MATERIALIZE: se rellenan al materializar,
# con su sha256, antes de la primera descarga del benchmark.

seed: 42                                        # contrato (3); Amendment 3 (--seed explícito)
tools_manifest: config/exp027_tool_manifest.json

redesign_rule: >-                               # Amendment 4
  No se rediseña tras inspeccionar el primer dato del benchmark.

cohort:                                         # Amendment 4 r1; Amendment 5 r1
  conditioning: phase3_unrelated_2504 minus {target} minus first_degree_relatives(target)
  patient_conditioning: phase3_unrelated_2504   # completa
  phase3_unrelated_ids: {path_key: exp027.phase3_unrelated_ids, sha256: TO_MATERIALIZE}
  pedigree:             {path_key: exp027.hc_1000g_pedigree,    sha256: TO_MATERIALIZE}

phasing:                                        # Amendments 3-4
  joint_input: conditioning_plus_target_unphased_genotypes
  phase_common_reference_panel: none            # sin --reference externo
  pedigree_in_inference: forbidden              # nunca --pedigree
  scaffold_maf_min: 0.001                       # Amendment 3 r4 (Hofmeister 2023)
  rare_and_singletons: phase_rare_on_scaffold
  chunk_overlap_buffer_bp_per_side: 250000      # Amendment 3 r5
  require_ligate_overlap: true                  # L_isec > 0 en el log de ligate
  genetic_map: {path_key: exp027.genetic_map_grch38, sha256: TO_MATERIALIZE}   # Amendment 3 r6: sin default
  validate_outputs_not_exit_codes: true         # C3: phase_rare devuelve 0 ante errores
  common_markers_have_no_PS_or_PP: true         # C3: no se parte la ventana por PS

markers:                                        # contrato (1); Amendment 3 r4
  analytic_maf_min: 0.01
  filter: PASS
  gq_min: 30
  depth_min: 20                                 # n_i = n_H1 + n_H2 >= 20 (Amendment 4 r3)

extractor:                                      # Amendment 4 r3
  tool: bcftools mpileup (bcftools 1.21, digest en el manifest)
  args: ["-q", "20", "-Q", "20", "--ff", "UNMAP,SECONDARY,QCFAIL,DUP,SUPPLEMENTARY", "-d", "10000", "-a", "FORMAT/AD"]
  overlapping_mates_detection: on               # sin -x
  same_for_1000g_and_case: true
  reference_by_sha256: TO_MATERIALIZE           # una por dataset (referencia de alineamiento)

statistic:                                      # contrato (1)
  delta_i: b_i - 0.5                            # b_i = n_H1 / (n_H1 + n_H2), H1 por la fase
  T: sum(delta_i) / sqrt(sum(0.25 / n_i))
  window_bp: 2000000
  h_min: 50                                     # tras todas las máscaras (Amendment 8 r6)
  split_windows: never                          # Amendment 3 r3
  null: phase_randomized                        # contrato (1); Loh 2018
  permutations_B: 10000
  p_value: (1 + count(|T_perm| >= |T_obs|)) / (B + 1)
  alpha: 0.05

families:                                       # Amendment 2 D4; Amendment 3 r11
  primary: {windows: [bub1b_window], correction: none_empirical_p}
  secondary_chr15: {window_bp: 2000000, step_bp: 500000, correction: BH}   # paso de 0.5 Mb: contrato (1)

windows:                                        # Amendment 3 r9; Amendment 4 r5; Amendment 8 r1, r7
  bub1b_window: {chrom: chr15, start: 39191079, end: 41191078}   # 1-based inclusiva; GENCODE v33
  lattice: "[k*2000000 + 1, (k+1)*2000000], autosomas GRCh38, enteras dentro del cromosoma"
  lattice_hash: SHA256("42:" + chrom + ":" + start), hex ascendente
  n_lattice_windows: 49
  n_calibration_tiles: 20                       # las 20 globales siguientes, comunes a los 20 hijos (Amendment 8 r7)
  tile_exclusion:                               # Amendment 8 r1: única pista que elimina tiles
    gaps_centromeres: {path_key: exp027.gaps_centromeres_grch38, sha256: TO_MATERIALIZE, overlap_bp_min: 1, on: core_2mb}
  lattice_tiles_overlapping_bub1b_window: ineligible
  window_substitution: none                     # Amendment 8 r6

site_masks:                                     # Amendment 8 r2-r5
  marker_span: "[POS, POS + len(REF) - 1]"      # interseca >= 1 pb
  global:                                       # retirados del input de fase y de todos los conjuntos
    gaps_centromeres: {path_key: exp027.gaps_centromeres_grch38, sha256: TO_MATERIALIZE}
    segdups:          {path_key: exp027.segdups_grch38,          sha256: TO_MATERIALIZE}
    encode_blacklist_v2: {path_key: exp027.encode_blacklist_v2_grch38, sha256: TO_MATERIALIZE}
  sv_callset: {path_key: exp027.hc_1000g_sv_callset, sha256: TO_MATERIALIZE}
  copy_changing:                                # regla A, clarificación de implementación de A8 (2026-10-04)
    DEL_DUP: GT integrado porta ALT
    mCNV: FORMAT/CN discreto != 2
    CPX: GT porta ALT y solo componentes DEL_/DUP_ de CPX_INTERVALS
    depth_estimates_never_create_carrier: true  # RD_CN, CN de svtools: solo descriptivos
  copy_neutral_never_mask: [INS, INV, BND, CTX]
  child_copy_changing: [phasing_input, apr, a1_benchmark, power, calibration_rho, ser]
  parent_copy_changing: [mendelian_truth, power, ser]   # no APR ni rho del hijo (Amendment 8 r5)
  padding_bp: 0
  audit_per_child_window: [n_before, n_mask_segdup, n_mask_blacklist, n_mask_child_copychange,
                           n_mask_parent_copychange_truth, n_after_intact, n_after_truth,
                           masked_bp_fraction_descriptive]
  fractions_are_gates: false

benchmark:                                      # Amendment 3 r14; Amendment 1 C2
  n_offspring: 20
  per_superpopulation: {AFR: 4, AMR: 4, EAS: 4, EUR: 4, SAS: 4}
  eligible: complete_trio_child_with_both_parents_sequenced
  selection_order: SHA256("42:" + sample_id), hex ascendente
  short_stratum: take_all_and_report
  depth: real_1000g_high_coverage_about_30x     # Amendment 2 M2: nunca "44x"
  truth: switch_minus_P_mendelian_resolvable_hets_only   # Amendment 3 r2

spike_in:                                       # Amendment 3 r7; Amendment 5 r2/r4; Amendment 6 r1
  model: beta_binomial
  delta_grid: [0.00, 0.02, 0.05, 0.10, 0.15, 0.20]
  applied_to: mendelian_resolvable_hets_only    # power y retención; APR usa el conjunto completo
  p: 0.5 +/- delta on true paternal allele
  sign: {even_rep: "+delta", odd_rep: "-delta"} # exactamente R/2 y R/2
  replicates: {bub1b_window: 100, other_windows: 2}   # por (hijo x delta) y (hijo x ventana x delta)
  draw_seed: int(SHA256("42:draw:" + child + ":" + window + ":" + delta + ":" + rep)[:16], 16)
  delta_zero_reps: synthetic_null_check_not_APR

rho:                                            # Amendment 4 r4; Amendment 5 r5
  pool: calibration_tiles_per_child_intact_data
  depth_bins: [[20, 30], [30, 40], [40, 60], [60, null]]
  estimator: max(0, (mean((b_i - 0.5)^2 * n_i / 0.25) - 1) / (mean(n_i) - 1))
  min_hets_per_bin: 200
  fallback: [per_child_bin, global_bin_20_children, global_all_20_children]

gates:                                          # Amendment 3 r10; Amendment 5 r3; Amendment 6; Amendment 7
  apr_calibration_sentinel:                     # Amendment 7: sustituye a "APR <= 0.05"
    K: pares hijo x ventana intactos con p_emp < 0.05
    N: pares hijo x ventana intactos evaluables
    test: binomial exacto unilateral, H0 p = 0.05, H1 p > 0.05
    fail_if: p_binom < 0.05                      # sin porcentaje fijo: el umbral sale de N
    report: [K, N, APR, p_binom]
    nature: centinela operativo de calibración, no FPR biológico (independencia aproximada)
  sensitivity_at_0_10_min: 0.80                 # fase inferida
  power_retention_min: 0.90                     # frente a fase mendeliana
  common_ser_max: 0.02                          # techo operativo, no umbral publicado
  stratum_veto: {ser_max: 0.04, sensitivity_at_0_10_min: 0.80}
  weighting: per_child_mean_of_windows_then_equal_weight_children   # Amendment 6 extensión
  bub1b_locus:
    evaluable_children_min: 15
    evaluable_superpopulations_min: 4
    sensitivity_at_0_10_min: 0.80
    power_retention_min: 0.90
    technical_sentinel: one_sided_exact_binomial_vs_0.05   # veto con >=3 si n_e=15-16, >=4 si n_e=17-20

a1:                                             # contrato (5); Amendment 3 r11-r12
  cnv_overlapping_window: NOT_EVALUABLE         # sin enmascarar; Amendment 8 r9 lo mantiene
  cn_loh_pattern: secondary_classification_only
  classes: [NO_EVIDENCE, SUGGESTIVE, CONSISTENT_WITH_HAPLOTYPE_SPECIFIC_ALLELIC_IMBALANCE]
  delta_star: 0.10

a2: UNSCORABLE_UNRESOLVED_unless_orthogonal_phase   # Amendment 4 r2: PP de phase_rare no basta

# Puntos que DECISIONS no fijaba de forma unívoca y que el código necesita.
# Son de serialización/implementación, no científicos: materializan reglas ya congeladas.
# CONFIRMADOS por el líder (2026-10-01).
implementation_decisions:
  status: CONFIRMED_2026-10-01                  # ventanas, serialización y efecto de A1
  evaluation_windows: >-
    SUSTITUIDO por Amendment 8. Una única lista global: las 49 primeras tiles de la retícula, en el
    orden hash congelado, que no solapan gaps/centrómeros ni la ventana BUB1B. Las mismas para los 20
    hijos; las máscaras de sitio no eliminan ventanas y Hmin decide la evaluabilidad.
  calibration_tiles: >-
    SUSTITUIDO por Amendment 8. Las 20 tiles siguientes del mismo orden global, comunes a los 20
    hijos y disjuntas de las de evaluación; cada hijo aplica sus máscaras de sitio dentro.
  serialization:
    child_selection: SHA256("42:" + sample_id)              # sample_id = ID de 1000G
    tile_order: SHA256("42:" + chr + ":" + start)           # literal; chr = "chrN", start en base 1
    window_id: "chrN:start-end"                             # GRCh38, base 1, inclusiva
    delta_fmt: ["0.00", "0.02", "0.05", "0.10", "0.15", "0.20"]   # siempre dos decimales
    rep: 0-based, 0..R-1
    draw_seed: int(SHA256("42:draw:" + child + ":" + window_id + ":" + delta_fmt + ":" + rep)[:16], 16)
    encoding: UTF-8/ASCII, sin espacios ni relleno
    sign: solo por paridad de rep (par = +delta, impar = -delta); el hash no interviene
  a1_effect_estimator: >-
    |delta_hat| = abs(mean(delta_i)) = |(1/H) * sum_i (b_i - 0.5)|, con cada delta_i orientado
    por la fase inferida, comparado con delta_star = 0.10. No es mean(abs(delta_i)), que mediría
    dispersión y no desequilibrio coherente; sin ponderación nueva (coherente con el numerador
    de T).

# Decisiones del ejecutor, CONFIRMADAS por el líder (2026-10-01) junto con Amendment 7.
executor_decisions:
  status: CONFIRMED_2026-10-01
  perm_seed_intact: int(SHA256("42:perm:OBS:" + child + ":" + window_id)[:16], 16)
  perm_seed_spike: int(SHA256("42:perm:SPIKE:" + child + ":" + window_id + ":" + delta_fmt + ":" + rep)[:16], 16)
  perm_seed_use: la semilla inicializa el RNG y de él salen las B = 10000 permutaciones
  a1_classes:
    - p_emp >= 0.05 -> NO_EVIDENCE
    - p_emp < 0.05 y |delta_hat| < 0.10 -> SUGGESTIVE
    - p_emp < 0.05 y |delta_hat| >= 0.10 -> CONSISTENT_WITH_HAPLOTYPE_SPECIFIC_ALLELIC_IMBALANCE
  ser_gate: marcadores analíticos MAF >= 1 % (de C_target); el SER del scaffold MAF >= 0.1 % es solo descriptivo
  apr_unit: pares hijo x ventana, con el centinela binomial de Amendment 7
  bub1b_superpop_evaluable: una superpoblación cuenta si tiene >= 1 hijo evaluable; se reporta n por superpoblación
  allele_frequencies: >-
    AC, AN y MAF (scaffold y analítica) se calculan solo en la cohorte de conditioning, antes de
    añadir al objetivo para la fase conjunta. Benchmark: C_target; paciente: los 2.504.
