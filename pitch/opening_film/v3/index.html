  EXT: { label: 'EXTERNAL EVIDENCE', col: INK }, HYPO: { label: 'HYPOTHESIS', col: INK }, NEXT: { label: 'PROPOSED EXPERIMENT', col: INK }

}
function chip(kind, x, y, a, note) {

  const w = CAPS(CHIP[kind].label, x + 24, y, 0.85 * a, { color: CHIP[kind].col === INK ? INK : mix(CHIP[kind].col, INK, 0.25) });

  return tw;
}
const hud = (t, a, b) => env(t, a, a + 0.5, b - 0.5, b);
function chapterTag(n, a) { if (a > 0.01) CAPS(`0${n}  ·  ${CONFIG.COPY.ch[n]}`, W - 96, 86, 0.55 * a, { align: 'right' }); }
function calmBand(a) {

}
/* drafting layer: construction circle, cross-hair with ruler ticks (after the reference film) */

// ================================================================ ACT I DATA (authored on the v1 clock, played slower)
// MASTER CLOCK (export seconds T). The cold open (incl. the restored research chain) is authored on the
// v1 clock and played ~1.3x slower than v1; the title and chapters are authored on clock A and played
// ~1.3x faster than before, with holds shortened in the MP4 (live, they wait for the clicker).
